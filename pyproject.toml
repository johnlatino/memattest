[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memattest"
version = "1.0.2"
description = "Tamper-evident AI agent memory: RFC 6962 append-only Merkle log with signed tree heads and provenance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=42",
    "keyring>=24",
    "psutil>=5.9",
    "filelock>=3.30",  # preserve_lock_file kwarg (do not lower this floor)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memattest = "memattest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memattest = ["integrations/claude_code/*.json"]
